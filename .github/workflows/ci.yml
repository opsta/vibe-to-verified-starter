name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - name: Firestore rules and adapter tests (emulator)
        run: npx -y firebase-tools@15.34.1 emulators:exec --only firestore,auth --project demo-vtv "npx vitest run --config vitest.rules.config.ts"
      # check:core is added in Task 7; this step fails until then.
      - run: npm run check:core
      - run: npm run check
